version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nisschay_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nikhilpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nisschay_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinic-network

  # 2. Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nisschay_cms?sslmode=disable
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: nikhilpassword
      SERVER_PORT: 8085
      NISSCHAY_APP_JWTSECRET: nisschaycmssecretkeyfortestingspringbootsecurityjwttokengeneration32bytes
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8085:8085"
    networks:
      - clinic-network

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8085/api/v1
    container_name: clinic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - clinic-network

volumes:
  postgres_data:

networks:
  clinic-network:
    driver: bridge
