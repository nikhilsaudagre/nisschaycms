spring.application.name=nisschay-cms-backend

# Server Configuration
server.port=8085

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nisschay_cms?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=nikhil
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Security JWT Configuration
# Base64 encoded key for HS256 (at least 256-bit, here we use a sample key: "nisschaycmssecretkeyfortestingspringbootsecurityjwttokengeneration32bytes")
nisschay.app.jwtSecret=nisschaycmssecretkeyfortestingspringbootsecurityjwttokengeneration32bytes
# JWT Expiration: 24 hours (86,400,000 ms) for smooth development testing
nisschay.app.jwtExpirationMs=86400000
# Refresh Token Expiration: 7 days (604,800,000 ms)
nisschay.app.jwtRefreshExpirationMs=604800000

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
