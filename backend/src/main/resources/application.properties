spring.application.name=nisschay-cms-backend

# Server Configuration (Dynamic Port for Cloud/Render, default 8085 locally)
server.port=${PORT:8085}

# Database Configuration (Environment variables with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/nisschay_cms?sslmode=disable}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USERNAME:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:nikhil}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Security JWT Configuration
nisschay.app.jwtSecret=${NISSCHAY_APP_JWTSECRET:nisschaycmssecretkeyfortestingspringbootsecurityjwttokengeneration32bytes}
nisschay.app.jwtExpirationMs=${NISSCHAY_APP_JWT_EXPIRATION_MS:86400000}
nisschay.app.jwtRefreshExpirationMs=${NISSCHAY_APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
