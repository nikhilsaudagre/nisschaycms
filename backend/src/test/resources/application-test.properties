# Server configuration
server.port=8081

# Test Database configuration (H2 Memory Database)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Security JWT configuration
nisschay.app.jwtSecret=testsecretkeyfortestingpurposestosecureapplicationandverifytests32bytes
nisschay.app.jwtExpirationMs=60000
nisschay.app.jwtRefreshExpirationMs=600000
